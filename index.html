<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retrospect — Photography in San Antonio, TX</title>
<meta name="description" content="Retrospect is a San Antonio, TX photography studio shooting product, business, event, show, and car photography.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Zilla+Slab:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* NAVILLE: paid, all-caps display font (Letterhend Studio).
     Note: the format() keyword for a .otf file is 'opentype', not 'otf' —
     'otf' isn't a value browsers recognize, so it's corrected below. */
  @font-face {
    font-family: 'Naville';
    src: url('fonts/Navill_ Bold.otf') format('opentype');
    font-weight: 700;
    font-display: swap;
  }

  :root{
    --cream: #dbccc1;
    --rust: #b05f1e;
    --charcoal: #2d3026;
    --gold: #b7a16f;
    --forest: #13312e;
    --sage: #4e634f;
    --font-display: 'Naville', 'Jost', 'Century Gothic', sans-serif;
    --font-body: 'Zilla Slab', Georgia, serif;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  body{
    background: var(--cream);
    color: var(--charcoal);
    font-family: var(--font-body);
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body.lb-open{ overflow: hidden; }

  a{ color: inherit; }

  h2{
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 600;
    font-size: 1.4rem;
    margin-bottom: 1.2rem;
  }

  header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 6vw;
    border-bottom: 1px solid rgba(45,48,38,0.15);
  }

  .logo{
    display: block;
    height: auto;
    width: auto;
    max-height: 32px;
    max-width: 160px;
  }

  .tabs{ display: flex; gap: 2rem; }

  .tab-btn{
    background: none;
    border: none;
    padding: 0.4rem 0;
    border-bottom: 2px solid transparent;
    cursor: pointer;
  }

  .tab-icon{
    display: block;
    width: 96px;
    height: 26px;
    background-color: var(--charcoal);
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-size: contain;
    mask-size: contain;
    /* Force alpha-channel masking (not luminance) so the opaque black
       shape is the visible part, not the cut-out part. */
    -webkit-mask-mode: alpha;
    mask-mode: alpha;
    transition: background-color 0.2s ease;
  }
  .tab-btn:hover .tab-icon{ background-color: var(--rust); }
  .tab-btn.active{ border-color: var(--rust); }
  .tab-btn.active .tab-icon{ background-color: var(--rust); }

  main{ max-width: 1000px; margin: 0 auto; padding: 3.5rem 6vw; text-align: center; }

  .tab-panel{ display: none; }
  .tab-panel.active{ display: block; }

  #retrospective p{ margin: 0 auto; }
  .contact-links{ align-items: center; }

  @media (max-width: 600px){
    header{ flex-direction: column; gap: 1rem; }
    .tabs{ gap: 1.4rem; }
    main{ padding: 2.5rem 6vw; }
  }

  /* Gallery — masonry columns, so each photo keeps its own aspect ratio
     (portrait, landscape, or square) instead of being forced into a square. */
  .grid{
    column-count: 2;
    column-gap: 0.6rem;
  }
  @media (min-width: 700px){ .grid{ column-count: 3; } }
  @media (min-width: 1000px){ .grid{ column-count: 4; } }

  /* Each photo is wrapped in a button by the script below so it is
     keyboard-focusable and announced as an action. */
  .tile-btn{
    display: block;
    width: 100%;
    break-inside: avoid;
    margin-bottom: 0.6rem;
    padding: 0;
    background: none;
    border: 0;
    cursor: zoom-in;
  }
  .tile{
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--charcoal);
    transition: opacity 0.2s ease;
  }
  .tile-btn:hover .tile{ opacity: 0.85; }

  /* Lightbox */
  .lightbox{
    width: 100%;
    height: 100%;
    max-width: 100vw;
    max-height: 100vh;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--cream);
    overflow: hidden;
  }
  .lightbox[open]{
    display: grid;
    grid-template-rows: auto 1fr;
  }
  .lightbox::backdrop{ background: rgba(19,49,46,0.95); }

  .lb-bar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 1rem;
  }
  .lb-count{
    font-family: var(--font-body);
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
    opacity: 0.85;
  }

  .lb-btn{
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    background: none;
    border: 1px solid transparent;
    border-radius: 50%;
    color: var(--cream);
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .lb-btn:hover{ color: var(--gold); border-color: var(--gold); }
  .lb-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }
  .lb-btn svg{ width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .lb-stage{
    position: relative;
    display: grid;
    grid-template-rows: 1fr auto;
    justify-items: center;
    align-items: center;
    min-height: 0;
    padding: 0 4rem 1rem;
    touch-action: pan-y;
  }
  .lb-figure{
    display: contents;
  }
  .lb-img{
    max-width: 100%;
    max-height: 100%;
    min-height: 0;
    object-fit: contain;
    opacity: 1;
    transition: opacity 0.2s ease;
  }
  .lb-img.is-loading{ opacity: 0; }
  .lb-caption{
    max-width: 60ch;
    padding-top: 0.75rem;
    font-size: 0.95rem;
    text-align: center;
    opacity: 0.85;
  }

  .lb-nav{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
  }
  .lb-prev{ left: 0.6rem; }
  .lb-next{ right: 0.6rem; }

  @media (max-width: 600px){
    .lb-stage{ padding: 0 0.5rem 0.75rem; }
    .lb-nav{ top: auto; bottom: 0.4rem; transform: none; }
    .lb-prev{ left: 0.5rem; }
    .lb-next{ right: 0.5rem; }
    .lb-caption{ padding: 0.75rem 3.5rem 0; min-height: 2.5rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .lb-img, .tile, .lb-btn{ transition: none; }
  }

  /* Retrospective (about) */
  #retrospective p{
    max-width: 60ch;
    font-size: 1.05rem;
    color: rgba(45,48,38,0.85);
  }

  /* Contact */
  .contact-links{ display: flex; flex-direction: column; gap: 0.7rem; }
  .contact-links a{
    font-family: var(--font-display);
    font-size: 1.2rem;
    text-decoration: none;
    width: fit-content;
    border-bottom: 1px solid transparent;
  }
  .contact-links a:hover{ border-color: var(--rust); }

  footer{
    padding: 1.5rem 6vw;
    font-size: 0.8rem;
    color: var(--sage);
    text-align: center;
  }

  :focus-visible{ outline: 2px solid var(--rust); outline-offset: 2px; }
</style>
</head>
<body>

<header>
  <img src="images/logo.png" alt="Retrospect logo" class="logo">
  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="gallery" role="tab" aria-selected="true" aria-label="Gallery">
      <span class="tab-icon" style="mask-image:url('images/gallery.png'); -webkit-mask-image:url('images/gallery.png');"></span>
    </button>
    <button class="tab-btn" data-tab="retrospective" role="tab" aria-selected="false" aria-label="Retrospective">
      <span class="tab-icon" style="mask-image:url('images/retrospective.png'); -webkit-mask-image:url('images/retrospective.png');"></span>
    </button>
    <button class="tab-btn" data-tab="contact" role="tab" aria-selected="false" aria-label="Contact">
      <span class="tab-icon" style="mask-image:url('images/contact.png'); -webkit-mask-image:url('images/contact.png');"></span>
    </button>
  </nav>
</header>

<main>
  <section id="gallery" class="tab-panel active">
    <!-- Each image's natural aspect ratio sets its own height in the masonry columns.
         Optional: add data-full="images/full/one.jpg" to any image to open a
         larger version in the lightbox; otherwise its own src is used. -->
    <div class="grid">
      <img class="tile" src="images/one.jpg" alt="Retrospect gallery photo 1">
      <img class="tile" src="images/two.jpg" alt="Retrospect gallery photo 2">
      <img class="tile" src="images/three.jpg" alt="Retrospect gallery photo 3">
      <img class="tile" src="images/four.jpg" alt="Retrospect gallery photo 4">
      <img class="tile" src="images/five.jpg" alt="Retrospect gallery photo 5">
      <img class="tile" src="images/six.jpg" alt="Retrospect gallery photo 6">
      <img class="tile" src="images/seven.jpg" alt="Retrospect gallery photo 7">
      <img class="tile" src="images/eight.jpg" alt="Retrospect gallery photo 8">
      <img class="tile" src="images/nine.jpg" alt="Retrospect gallery photo 9">
      <img class="tile" src="images/ten.jpg" alt="Retrospect gallery photo 10">
      <img class="tile" src="images/eleven.jpg" alt="Retrospect gallery photo 11">
      <img class="tile" src="images/twelve.jpg" alt="Retrospect gallery photo 12">
    </div>
  </section>

  <section id="retrospective" class="tab-panel">
    <img class="about-photo" src="images/thirteen.jpg" alt="Describe the photo here" width="360" height="240">
    <h2>Retrospective</h2>
    <p>At Retrospect, when a scene deserves to be captured, we prioritize client satisfaction and keep their perspective in focus. Contact us anytime, and we'll start bringing your vision to life.</p>
  </section>

  <section id="contact" class="tab-panel">
    <h2>Contact</h2>
    <div class="contact-links">
      <a href="mailto:booking@retrospectsatx.com">booking@retrospectsatx.com</a>
      <a href="tel:+18305074520">(830) 507-4520</a>
    </div>
  </section>
</main>

<footer>Retrospect &middot; San Antonio, TX</footer>

<!-- Lightbox: a native <dialog>, which gives us focus trapping, Esc to close,
     and a proper modal backdrop for free. -->
<dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
  <div class="lb-bar">
    <span class="lb-count" id="lb-count" aria-live="polite"></span>
    <button class="lb-btn" id="lb-close" type="button" aria-label="Close viewer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <div class="lb-stage" id="lb-stage">
    <figure class="lb-figure">
      <img class="lb-img" id="lb-img" alt="">
      <figcaption class="lb-caption" id="lb-caption"></figcaption>
    </figure>
    <button class="lb-btn lb-nav lb-prev" id="lb-prev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="lb-btn lb-nav lb-next" id="lb-next" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</dialog>

<script>
  /* Tabs */
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      document.querySelectorAll('.tab-panel').forEach(function(p){
        p.classList.remove('active');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      document.getElementById(btn.dataset.tab).classList.add('active');
    });
  });

  /* Lightbox */
  (function(){
    var box     = document.getElementById('lightbox');
    var stage   = document.getElementById('lb-stage');
    var img     = document.getElementById('lb-img');
    var caption = document.getElementById('lb-caption');
    var count   = document.getElementById('lb-count');
    var prevBtn = document.getElementById('lb-prev');
    var nextBtn = document.getElementById('lb-next');
    var closeBtn = document.getElementById('lb-close');

    var tiles = Array.prototype.slice.call(document.querySelectorAll('.grid .tile'));
    var buttons = [];
    var current = 0;

    // Wrap each photo in a button so it's keyboard accessible.
    tiles.forEach(function(tile, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile-btn';
      b.setAttribute('aria-label', 'View larger: ' + tile.alt);
      tile.parentNode.insertBefore(b, tile);
      b.appendChild(tile);
      b.addEventListener('click', function(){ open(i, b); });
      buttons.push(b);
    });

    function fullSrc(i){ return tiles[i].dataset.full || tiles[i].currentSrc || tiles[i].src; }

    function show(i){
      current = (i + tiles.length) % tiles.length;
      var tile = tiles[current];
      var src = fullSrc(current);

      img.classList.add('is-loading');
      img.onload = img.onerror = function(){ img.classList.remove('is-loading'); };
      img.src = src;
      img.alt = tile.alt;
      if (img.complete) img.classList.remove('is-loading');

      caption.textContent = tile.alt;
      count.textContent = (current + 1) + ' / ' + tiles.length;

      // Preload neighbors so next/prev feel instant.
      [current + 1, current - 1].forEach(function(n){
        var p = new Image();
        p.src = fullSrc((n + tiles.length) % tiles.length);
      });
    }

    function open(i){
      show(i);
      document.body.classList.add('lb-open');
      box.showModal();
    }

    function close(){ box.close(); }

    // Fires for Esc and for close(); dialog returns focus to the last
    // focused element, but we set it explicitly to the photo you were on.
    box.addEventListener('close', function(){
      document.body.classList.remove('lb-open');
      img.removeAttribute('src');
      if (buttons[current]) buttons[current].focus();
    });

    prevBtn.addEventListener('click', function(){ show(current - 1); });
    nextBtn.addEventListener('click', function(){ show(current + 1); });
    closeBtn.addEventListener('click', close);

    // Click on the dark area (not the photo or controls) closes.
    box.addEventListener('click', function(e){
      if (e.target === box || e.target === stage) close();
    });

    // Arrow keys (Esc is handled natively by <dialog>).
    box.addEventListener('keydown', function(e){
      if (e.key === 'ArrowLeft'){ e.preventDefault(); show(current - 1); }
      if (e.key === 'ArrowRight'){ e.preventDefault(); show(current + 1); }
    });

    // Swipe left/right on touch screens.
    var startX = null, startY = null;
    stage.addEventListener('touchstart', function(e){
      startX = e.changedTouches[0].clientX;
      startY = e.changedTouches[0].clientY;
    }, {passive: true});
    stage.addEventListener('touchend', function(e){
      if (startX === null) return;
      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;
      startX = startY = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5){
        show(dx < 0 ? current + 1 : current - 1);
      }
    }, {passive: true});
  })();
</script>

</body>
</html>
